name: green-armor-cyber-range

services:
  ga-attacker:
    build: ./attacker
    container_name: ga-attacker
    hostname: ga-attacker
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW
    networks:
      ga-corp:
        ipv4_address: 172.16.10.10
    depends_on:
      ga-pivot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ip -4 addr show eth0 | grep -q '172.16.10.10/24'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ga-pivot:
    build: ./pivot
    container_name: ga-pivot
    hostname: ga-pivot
    networks:
      ga-corp:
        ipv4_address: 172.16.10.20
      ga-internal:
        ipv4_address: 10.10.20.20
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':22 '"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ga-internal-web:
    build: ./internal-web
    container_name: ga-internal-web
    hostname: ga-internal-web
    networks:
      ga-internal:
        ipv4_address: 10.10.20.30
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health.txt | grep -q '^OK$'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ga-internal-ssh:
    build: ./internal-ssh
    container_name: ga-internal-ssh
    hostname: ga-internal-ssh
    networks:
      ga-internal:
        ipv4_address: 10.10.20.40
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':22 '"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  ga-corp:
    name: ga-corp
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.10.0/24
  ga-internal:
    name: ga-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.20.0/24
